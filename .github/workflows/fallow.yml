name: Fallow Analysis

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 04:00 UTC
    - cron: '0 4 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  fallow:
    name: Fallow Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Fallow analysis
        # || true so the step never fails even when issues are found;
        # issue creation happens in a later step
        run: npx fallow --format json > fallow-results.json || true

      - name: Upload Fallow report
        uses: actions/upload-artifact@v4
        with:
          name: fallow-report
          path: fallow-results.json
          if-no-files-found: warn

      - name: Ensure Fallow label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "Fallow" \
            --color "8B5CF6" \
            --description "Identified by Fallow static analysis" \
            --repo "${{ github.repository }}" || true

      - name: Create GitHub issues from Fallow findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/fallow-create-issues.mjs
